<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Report Formula — All Formulas in One Click</title>
    <meta name="google-site-verification" content="oBRdj6PgG-3RGx7CruAXeQ8960RkrXpTybCPLlDj7n8" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<!-- CSS LINK -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

<header>
  <div class="logo-badge">⚡ EXCEL FORMULA LIBRARY v2.0</div>
  <h1><span class="neon">EXCEL</span> <span class="neon2">REPORT</span><br>FORMULA</h1>
  <p class="tagline">All Excel Formulas in One Click</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍  Search formula or report name..." />
    <span class="search-icon">⌕</span>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-num" id="totalReports">14</div><div class="stat-label">Reports</div></div>
  <div class="stat"><div class="stat-num" id="totalFormulas">77</div><div class="stat-label">Formulas</div></div>
  <div class="stat"><div class="stat-num">100%</div><div class="stat-label">Free</div></div>
</div>
<div class="section-label">Select Report to View Formulas</div>

<div class="grid" id="reportGrid">
  <!-- Cards injected by JS -->
</div>
<div id="noResults" class="no-results"><span class="no-results-icon">🔍</span><p>No results found. Try a different keyword.</p></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-icon" id="modalIcon"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-subtitle" id="modalSubtitle"></div>
    </div>
    <div class="modal-use" id="modalUse"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>
  <span>EXCEL REPORT FORMULA</span> — All Formulas in One Click &nbsp;|&nbsp; Built for Students & Office Workers
</footer>

    <!-- js LINK -->
    <script src="script.js"></script>

</body>
</html>
